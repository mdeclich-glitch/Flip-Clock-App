<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Flip Clock Screensaver</title>
<style>
:root {
  --bg: #000;
  --card: #141414;
  --top: #ece8dd;
  --bottom: #ece8dd;
  box-sizing: border-box;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  overflow: hidden;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  cursor: none; /* Nasconde il mouse */
}

/* Wrapper esatto come in index_2.html per il calcolo delle proporzioni */
#wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  --h: min(52vh, 30vw);
  --w: calc(var(--h) * 1.145);
}

#stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
}

/* --- Temi della cassa: stessi dell'orologio principale (attributo data-case su <html>) --- */
:root{--case-bg:linear-gradient(180deg,#1c1c1c,#0b0b0b);--case-hi:rgba(255,255,255,.07)}
html[data-case="wood"]{--case-bg:repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 2px,rgba(255,255,255,.03) 2px 5px),linear-gradient(180deg,#7a4b26,#432712);--case-hi:rgba(255,220,170,.28)}
html[data-case="alu"]{--case-bg:linear-gradient(180deg,#d9dbde,#8f9399);--case-hi:rgba(255,255,255,.7)}
html[data-case="white"]{--case-bg:linear-gradient(180deg,#f4f4f1,#cdcdc7);--case-hi:rgba(255,255,255,.9)}
html[data-case="navy"]{--case-bg:linear-gradient(180deg,#1f3254,#0b1424);--case-hi:rgba(150,180,255,.18)}
html[data-case="red"]{--case-bg:linear-gradient(180deg,#8f2222,#4a0e0e);--case-hi:rgba(255,160,160,.2)}
html[data-case="orange"]{--case-bg:linear-gradient(180deg,#f07a24,#b8470f);--case-hi:rgba(255,215,170,.4)}
html[data-case="green"]{--case-bg:linear-gradient(180deg,#24503a,#0f2a1d);--case-hi:rgba(150,230,190,.18)}
/* Colori di giorno e data (stanno sulla cassa, quindi cambiano con il tema) */
:root{--plate:#8f8b80;--plate-b:#ece8dd;--plate-sh:transparent}
html[data-case="wood"]{--plate:#e6d3b5;--plate-b:#fff3dc;--plate-sh:rgba(0,0,0,.45)}
html[data-case="alu"]{--plate:#3a3d42;--plate-b:#0f1012;--plate-sh:rgba(255,255,255,.55)}
html[data-case="white"]{--plate:#5a5a54;--plate-b:#161614;--plate-sh:rgba(255,255,255,.8)}
html[data-case="navy"]{--plate:#a9b8d6;--plate-b:#eef2fa;--plate-sh:rgba(0,0,0,.4)}
html[data-case="red"]{--plate:#e8bcbc;--plate-b:#fff;--plate-sh:rgba(0,0,0,.4)}
html[data-case="orange"]{--plate:#ffe6cc;--plate-b:#fff;--plate-sh:rgba(70,25,0,.5)}
html[data-case="green"]{--plate:#b5d3c2;--plate-b:#eef8f2;--plate-sh:rgba(0,0,0,.4)}

/* --- Look Flip Clock Analogico --- */
.clock {
  display: flex;
  padding: calc(var(--h) * .035);
  gap: calc(var(--h) * .03);
  border-radius: calc(var(--h) * .075);
  background: var(--case-bg);
  box-shadow: inset 0 1px 0 var(--case-hi), inset 0 -1px 0 rgba(0,0,0,.8), 0 calc(var(--h) * .05) calc(var(--h) * .12) rgba(0,0,0,.9);
  /* Niente margin-right negativo: la centratura sui cartellini Ore/Minuti (come in index.html) la fa
     applyShift() misurando gli spazi reali, così l'orologio non può mai essere tagliato a destra. */
  margin-right: 0;
  flex-shrink: 0;
}

.card {
  position: relative;
  width: var(--w);
  height: var(--h);
  perspective: calc(var(--h) * 4);
  background: #000;
  border-radius: calc(var(--h) * .05);
  box-shadow: 0 0 0 1px #050505, 0 2px 3px rgba(0,0,0,.7);
  flex-shrink: 0;
}

.half {
  position: absolute;
  left: 0; right: 0;
  height: 50%;
  overflow: hidden;
  background: var(--card);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.half span {
  position: absolute;
  left: 0; right: 0;
  height: 200%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--h) * .68);
  font-weight: 700;
  letter-spacing: -.03em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 1px rgba(0,0,0,.6);
  z-index: 1;
}

.t {
  top: 0;
  background: linear-gradient(180deg, #262626, #151515);
  border-radius: calc(var(--h) * .05) calc(var(--h) * .05) 0 0;
  color: var(--top);
}
.t span { top: 0; }

.b {
  bottom: 0;
  background: linear-gradient(180deg, #101010, #1c1c1c);
  border-radius: 0 0 calc(var(--h) * .05) calc(var(--h) * .05);
  color: var(--bottom);
}
.b span { bottom: 0; }

.t::after, .b::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
}
.t::after { background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.45)); }
.b::after { background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(255,255,255,.03)); }

.flap-t { transform-origin: 50% 100%; z-index: 3; }
.flap-b { transform-origin: 50% 0; transform: rotateX(90deg); z-index: 2; }

.go .flap-t { animation: fall .3s ease-in forwards; }
.go .flap-b { animation: rise .3s .3s ease-out forwards; }
@keyframes fall { to { transform: rotateX(-90deg); } }
@keyframes rise { to { transform: rotateX(0); } }

.flap-t::before, .flap-b::before {
  content: ""; position: absolute; inset: 0; background: #000; opacity: 0; z-index: 4; pointer-events: none;
}
.flap-b::before { opacity: .75; }
.go .flap-t::before { animation: shadeIn .3s ease-in forwards; }
.go .flap-b::before { animation: shadeOut .3s .3s ease-out forwards; }
@keyframes shadeIn { to { opacity: .75; } }
@keyframes shadeOut { to { opacity: 0; } }

.card::after {
  content: ""; position: absolute; left: 0; right: 0; top: 50%; z-index: 5;
  height: max(2px, calc(var(--h) * .012));
  margin-top: calc(max(2px, var(--h) * .012) / -2);
  background: #000;
  box-shadow: 0 1px 0 rgba(255,255,255,.06);
}

.card::before {
  content: ""; position: absolute; top: 50%; left: calc(var(--h) * -.012); right: calc(var(--h) * -.012);
  height: calc(var(--h) * .07); margin-top: calc(var(--h) * -.035); z-index: 6; pointer-events: none; border-radius: 2px;
  background: linear-gradient(180deg, #444, #161616) left center/calc(var(--h) * .03) 100% no-repeat,
              linear-gradient(180deg, #444, #161616) right center/calc(var(--h) * .03) 100% no-repeat;
}

.ampm {
  position: absolute; left: calc(var(--h) * .07); top: calc(var(--h) * .07); z-index: 6;
  font-size: calc(var(--h) * .085); font-weight: 700; color: #9a968c;
}
.ampm span { display: inline-block; margin-right: .6em; letter-spacing: .1em; opacity: .3; }
.ampm span.on { opacity: 1; color: #ece8dd; }

/* --- Rullo Secondi e Data --- */
.side {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--h) * .06); width: calc(var(--h) * .37);
  flex-shrink: 0;
}

.drum {
  position: relative; width: calc(var(--h) * .347); aspect-ratio: 104/186;
  border-radius: calc(var(--h) * .04); background: #060606; overflow: hidden;
  box-shadow: inset 0 0 0 2px #1d1d1d, inset 0 0 14px #000;
  flex-shrink: 0;
}

.strip { display: block; width: 100%; height: auto; will-change: transform; }

.drum .shade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 22%, rgba(255,255,255,.04) 50%, rgba(0,0,0,.55) 78%, #000 100%);
}

.drum .mark {
  position: absolute; left: 0; right: 0; top: 50%;
  height: max(2px, calc(var(--h) * .007));
  margin-top: calc(max(2px, var(--h) * .007) / -2);
  background: #e0452e;
}

.dplate {
  font-weight: 600; font-size: max(11px, calc(var(--h) * .047)); letter-spacing: .16em;
  color: var(--plate); text-shadow: 0 1px 0 var(--plate-sh); text-align: center; line-height: 1.35; white-space: nowrap;
  flex-shrink: 0;
}
.dplate b { color: var(--plate-b); font-weight: 700; }

@media (max-width: 700px) and (orientation: portrait) {
  #wrapper { --h: min(30vh, 58vw); --w: calc(var(--h) * 1.145); }
  .clock { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  .go .flap-t, .go .flap-b { animation-duration: .01s; animation-delay: 0s; }
  .strip { transition: none !important; }
}
</style>
</head>
<body>

<div id="wrapper">
  <div id="stage">
    <main class="clock" aria-label="Orologio">
      <!-- Cartellino Ore -->
      <div class="card" id="h"><div class="ampm" id="ampm"></div></div>
      <!-- Cartellino Minuti -->
      <div class="card" id="m"></div>
      <!-- Rullo dei Secondi e Data -->
      <div class="side">
        <div class="drum">
          <svg class="strip" id="strip" viewBox="0 0 104 1260" aria-hidden="true"></svg>
          <i class="shade"></i><i class="mark"></i>
        </div>
        <div class="dplate" id="dplate" aria-label="Data"></div>
      </div>
    </main>
  </div>
</div>

<script>
(function() {
  const { ipcRenderer } = require('electron');

  var q = new URLSearchParams(location.search);
  /* Tema della cassa: lo screensaver ignora quello scelto nell'app. Una cassa chiara (alu, white, orange...)
     è una grande area luminosa, molto peggiore per un OLED delle cifre. Valori sensati: 'dark' (default) o 'navy'. */
  var SAVER_CASE = 'dark';
  document.documentElement.setAttribute('data-case', SAVER_CASE);
  var BLANK = q.get('blank') === '1';          // vero sui monitor secondari
  var h24 = q.get('h24') !== '0', tz;          // tz non impostato = fuso del sistema

  /* Attenuazione anti burn-in: luminosità complessiva dell'orologio (1 = piena, 0.65 = 65%).
     Sul nero equivale a ridurre la luminosità; l'usura OLED cala più che linearmente (stima, non misura). */
  var DIM = 0.65;
  document.getElementById('stage').style.opacity = DIM;

  /* Uscita: ignora gli input nei primi 800 ms (all'avvio ne arrivano di spuri) */
  var ARM = Date.now() + 800, initPos = null;
  function quit() { if (Date.now() > ARM) ipcRenderer.send('close-screensaver'); }
  ['keydown', 'mousedown', 'wheel', 'touchstart'].forEach(function (ev) {
    window.addEventListener(ev, quit, { passive: true });
  });
  window.addEventListener('mousemove', function (e) {
    if (!initPos) { initPos = { x: e.screenX, y: e.screenY }; return; }
    if (Math.abs(e.screenX - initPos.x) > 15 || Math.abs(e.screenY - initPos.y) > 15) quit();
  });

  /* Monitor secondari: solo nero, nessun orologio */
  if (BLANK) { document.getElementById('wrapper').style.display = 'none'; return; }

  /* Dopo BLACK_MIN minuti lo schermo diventa nero, perché su OLED il nero non consuma. Vale sia quando
     lo avvia l'app sia come screensaver di Windows (/s), che da solo non ha limiti: Windows spegne lo
     schermo solo con il suo timer. Metti 0 per tenere sempre l'orologio. */
  var BLACK_MIN = 30, blackened = false;
  if (BLACK_MIN > 0) setTimeout(function () {
    blackened = true; document.getElementById('wrapper').style.display = 'none';
  }, BLACK_MIN * 60000);

  // Motore dei Cartellini a Scatto
  function Card(el) {
    this.el = el; this.val = null;
    el.insertAdjacentHTML('beforeend',
      '<div class="half t"><span></span></div><div class="half b"><span></span></div>' +
      '<div class="half t flap-t"><span></span></div><div class="half b flap-b"><span></span></div>');
    var s = el.querySelectorAll('.half span');
    this.st = s[0]; this.sb = s[1]; this.ft = s[2]; this.fb = s[3];
  }

  Card.prototype.set = function(v) {
    var self = this;
    if (this.val === null) { this.st.textContent = this.sb.textContent = this.ft.textContent = this.fb.textContent = v; this.val = v; return; }
    if (v === this.val) return;
    var old = this.val; this.val = v;

    this.st.textContent = v; this.sb.textContent = old; this.ft.textContent = old; this.fb.textContent = v;
    this.el.classList.remove('go'); void this.el.offsetWidth;
    this.el.classList.add('go');

    clearTimeout(this.t);
    this.t = setTimeout(function() {
      self.sb.textContent = v; self.ft.textContent = v;
      self.el.classList.remove('go');
    }, 620);
  };

  var hc = new Card(document.getElementById('h'));
  var mc = new Card(document.getElementById('m'));
  var ampm = document.getElementById('ampm');
  var pad = function(n) { return (n < 10 ? '0' : '') + n; };

  // --- Motore del Rullo dei Secondi ---
  var SP = 7, CEN = 93, TOTAL = 1260, strip = document.getElementById('strip');
  (function() {
    var p = [];
    for (var i = 0; i < 180; i++) {
      var kk = i % 60, y = i * SP, big = kk % 5 === 0, L = big ? 20 : 11;
      p.push('<line x1="' + (96 - L) + '" y1="' + y + '" x2="96" y2="' + y + '" stroke="#d6d1c4" stroke-width="' + (big ? 2 : 1) + '"/>');
      if (big) p.push('<text x="12" y="' + (y + 4) + '" font-size="13" font-weight="700" fill="' + (kk % 15 === 0 ? '#ece8dd' : '#8f8b80') + '" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">' + pad(kk) + '</text>');
    }
    strip.innerHTML = p.join('');
  })();

  function stripPos(i) { return 'translateY(' + ((CEN - i * SP) / TOTAL * 100) + '%)'; }
  function drumTick() {
    var d = new Date(), s = d.getSeconds(), rest = (1000 - d.getMilliseconds()) / 1000;
    strip.style.transition = 'none';
    strip.style.transform = stripPos(60 + s + (1 - rest));
    strip.getBoundingClientRect(); // Forza il re-layout
    strip.style.transition = 'transform ' + rest.toFixed(3) + 's linear';
    strip.style.transform = stripPos(60 + s + 1);
  }

  // Motore della Data
  var dplate = document.getElementById('dplate'), dsig = '', dfmt = null;
  try { dfmt = new Intl.DateTimeFormat('it-IT', { timeZone: tz || undefined, weekday: 'short', day: 'numeric', month: 'short' }); } catch(e) {}
  function abbr(x) { return String(x || '').replace('.', '').toUpperCase().slice(0, 3); }
  function drawDate() {
    var o = {};
    try { (dfmt || new Intl.DateTimeFormat('it-IT', { weekday: 'short', day: 'numeric', month: 'short' })).formatToParts(new Date()).forEach(function(x) { o[x.type] = x.value; }); } catch(e) { return; }
    var sig = o.weekday + '|' + o.day + '|' + o.month;
    if (sig === dsig) return; dsig = sig;
    dplate.textContent = '';
    var b = document.createElement('b'); b.textContent = abbr(o.weekday);
    dplate.appendChild(b); dplate.appendChild(document.createElement('br'));
    dplate.appendChild(document.createTextNode(o.day + ' ' + abbr(o.month)));
  }

  // Tick Cartellini Ore/Minuti
  function parts() {
    var d = new Date();
    try {
      var r = { h: 0, m: 0 };
      new Intl.DateTimeFormat('en-GB', { hour: 'numeric', minute: 'numeric', hourCycle: 'h23', timeZone: tz })
        .formatToParts(d).forEach(function(x) {
          if (x.type === 'hour') r.h = (+x.value) % 24;
          if (x.type === 'minute') r.m = +x.value;
        });
      return r;
    } catch(e) { return { h: d.getHours(), m: d.getMinutes() }; }
  }

  function tick() {
    var t = parts(), hr = t.h;
    if (h24) {
      ampm.innerHTML = '';
    } else {
      ampm.innerHTML = '<span' + (hr < 12 ? ' class="on"' : '') + '>AM</span><span' + (hr >= 12 ? ' class="on"' : '') + '>PM</span>';
      hr = hr % 12 || 12;
    }
    hc.set(h24 ? pad(hr) : String(hr)); mc.set(pad(t.m));
  }

  // --- Pixel Shift anti burn-in per OLED ---
  /* All'avvio l'orologio è centrato sui cartellini Ore/Minuti (come in index.html: il rullo dei secondi
     sporge a destra) e da lì si sposta di pochi pixel a ogni cambio minuto (il flip nasconde il passo).
     - Onda triangolare: l'orologio passa lo stesso tempo in ogni posizione, senza accumuli agli estremi.
     - La fase di partenza è sullo zero dell'onda (= centro); il verso iniziale è casuale per ogni asse,
       così le sessioni successive non ripercorrono sempre la stessa traiettoria.
     - In verticale il periodo è moltiplicato per il rapporto aureo.
     - L'ampiezza è limitata dallo spazio libero MISURATO attorno all'orologio (compreso il rullo a destra):
       non può uscire dallo schermo, nemmeno su monitor con proporzioni insolite. */
  var SHIFT_PCT = 6.5;      /* ampiezza orizzontale massima, in % del lato corto della finestra (0 = spento) */
  var SHIFT_PERIOD = 1800;  /* secondi per un'escursione completa in orizzontale (30 min = una sessione) */
  var SHIFT_SAFE = 12;      /* spazio minimo (px) che resta sempre tra orologio e bordo dello schermo */
  var PHI = 1.6180339887;
  var stage = document.getElementById('stage'), clockEl = document.querySelector('.clock');
  var hEl = document.getElementById('h'), mEl = document.getElementById('m');
  var START = Date.now();
  var PH_X = Math.random() < .5 ? .25 : .75, PH_Y = Math.random() < .5 ? .25 : .75; /* tri() = 0 in entrambe */
  var curX = 0, curY = 0, lastShift = '', lastShiftMin = -1;
  function tri(p) { p = ((p % 1) + 1) % 1; return 4 * Math.abs(p - .5) - 1; } /* -1..1, zero a p = .25 e .75 */
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function applyShift() {
    var min = Math.floor(Date.now() / 60000);
    if (min === lastShiftMin) return;            /* un solo spostamento per minuto */
    lastShiftMin = min;
    var d = window.devicePixelRatio || 1;
    /* posizione "a riposo" dell'orologio, senza lo spostamento corrente */
    var rc = clockEl.getBoundingClientRect(), rh = hEl.getBoundingClientRect(), rm = mEl.getBoundingClientRect();
    var baseL = rc.left - curX, baseR = rc.right - curX, baseT = rc.top - curY, baseB = rc.bottom - curY;
    /* centro: i cartellini Ore/Minuti al centro dello schermo (poi limitato perché tutto resti visibile) */
    var minX = SHIFT_SAFE - baseL, maxX = innerWidth - SHIFT_SAFE - baseR;
    var minY = SHIFT_SAFE - baseT, maxY = innerHeight - SHIFT_SAFE - baseB;
    if (minX > maxX) minX = maxX = (minX + maxX) / 2;  /* non c'è spazio: resta centrato sull'orologio intero */
    if (minY > maxY) minY = maxY = (minY + maxY) / 2;
    var cx = clamp(innerWidth / 2 - ((rh.left + rm.right) / 2 - curX), minX, maxX);
    var cy = clamp(0, minY, maxY);
    var A = SHIFT_PCT ? Math.min(innerWidth, innerHeight) * SHIFT_PCT / 100 : 0;
    var Ax = Math.max(0, Math.min(A, cx - minX, maxX - cx));
    var Ay = Math.max(0, Math.min(A * .75, cy - minY, maxY - cy));
    var t = (Date.now() - START) / 1000;
    /* arrotonda ai pixel fisici (non a quelli CSS): con scala 150% le cifre restano nitide */
    var x = Math.round((cx + Ax * tri(PH_X + t / SHIFT_PERIOD)) * d) / d;
    var y = Math.round((cy + Ay * tri(PH_Y + t / (SHIFT_PERIOD * PHI))) * d) / d;
    var v = 'translate(' + x + 'px,' + y + 'px)';
    if (v !== lastShift) { lastShift = v; curX = x; curY = y; stage.style.transform = v; }
  }
  /* se cambia la risoluzione/scala, ricalcola subito (l'orologio non deve restare fuori centro) */
  window.addEventListener('resize', function () { lastShiftMin = -1; try { applyShift(); } catch (e) { console.error(e); } });

  // Loop dei secondi: aggiorna rullo, data e cartellini nello stesso istante.
  // Il try/catch evita che un errore fermi il ciclo.
  function secLoop() {
    if (blackened) return;
    try { drumTick(); drawDate(); tick(); } catch (e) { console.error(e); }
    try { applyShift(); } catch (e) { console.error(e); } /* un errore qui non ferma l'orologio */
    setTimeout(secLoop, 1000 - Date.now() % 1000 + 5);
  }
  secLoop();

})();
</script>
</body>
</html>
