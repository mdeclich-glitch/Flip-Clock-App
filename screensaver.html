<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Clock Screensaver</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      cursor: none; /* Nasconde il cursore */
    }
    .clock-container {
      display: flex;
      gap: 20px;
      font-size: 8rem;
      font-weight: bold;
      background: #1a1a1a;
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      transition: transform 5s ease-in-out; /* Per la protezione OLED */
    }
    .card {
      background: #262626;
      padding: 20px 30px;
      border-radius: 12px;
      min-width: 160px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="clock-container" id="clock">
    <div class="card" id="hours">00</div>
    <div>:</div>
    <div class="card" id="minutes">00</div>
    <div>:</div>
    <div class="card" id="seconds">00</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // 1. Aggiornamento Orologio
    function updateClock() {
      const now = new Date();
      document.getElementById('hours').textContent = String(now.getHours()).padStart(2, '0');
      document.getElementById('minutes').textContent = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('seconds').textContent = String(now.getSeconds()).padStart(2, '0');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Protezione OLED (Pixel Shift impercettibile ogni 60 secondi)
    setInterval(() => {
      const clock = document.getElementById('clock');
      const randomX = (Math.random() - 0.5) * 30; // Shift tra -15px e +15px
      const randomY = (Math.random() - 0.5) * 30;
      clock.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }, 60000);

    // 3. Gestione Uscita Sicura al Movimento Mouse / Pressione Tasto
    let initialPos = null;

    window.addEventListener('mousemove', (e) => {
      // Salva la posizione iniziale del mouse per evitare micro-movimenti automatici all'avvio
      if (!initialPos) {
        initialPos = { x: e.screenX, y: e.screenY };
        return;
      }

      // Calcola la distanza dello spostamento del mouse
      const deltaX = Math.abs(e.screenX - initialPos.x);
      const deltaY = Math.abs(e.screenY - initialPos.y);

      // Tolleranza di 15 pixel prima di interpretare il movimento come intenzione d'uscita
      if (deltaX > 15 || deltaY > 15) {
        ipcRenderer.send('close-screensaver');
      }
    });

    window.addEventListener('keydown', () => {
      ipcRenderer.send('close-screensaver');
    });

    window.addEventListener('mousedown', () => {
      ipcRenderer.send('close-screensaver');
    });
  </script>
</body>
</html>
